name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar APKs
        uses: actions/upload-artifact@v4
        with:
          name: LibreDescargas-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar en Releases (para descargar desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LibreDescargas ${{ github.run_number }}
          body: |
            Instala **app-arm64-v8a-release.apk** (sirve para casi todos los celulares modernos).
            Si no instala, usa **app-armeabi-v7a-release.apk** o **app-universal-release.apk**.
          files: app/build/outputs/apk/release/*.apk
